<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ReceiptBin">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<title>搜索 - ReceiptBin</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">ReceiptBin</a>
  <div class="topbar-actions">
    <a class="icon-btn" href="/upload" aria-label="扫小票">＋</a>
    <div class="topbar-menu">
      <button class="icon-btn" id="topMenuBtn" aria-label="菜单">⋯</button>
      <div class="menu-pop" id="topMenuPop" hidden>
        <a class="menu-item" href="/receipts">小票</a>
        <a class="menu-item" href="/search">搜索</a>
        <a class="menu-item" href="/watchlist">盯价</a>
        <a class="menu-item" href="/alerts">提醒<span class="badge-inline" data-alert-badge hidden></span></a>
        <a class="menu-item" href="/settings">设置</a>
        <button class="menu-item danger" id="logoutBtn">登出</button>
      </div>
    </div>
  </div>
</header>
<main>
  <h1>搜索商品</h1>
  <div class="filters">
    <input type="search" id="q" placeholder="货号或品名，如 1000008 或足球" autocomplete="off">
  </div>
  <div id="results"><p class="muted">输入货号或品名，实时搜索买过的商品。</p></div>
</main>
<div id="toast"></div>
<script src="/static/app.js"></script>
<script src="/static/search.js"></script>
</body>
</html>
