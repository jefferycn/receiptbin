<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ReceiptBin">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<title>小票 - ReceiptBin</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">ReceiptBin</a>
  <div class="topbar-actions">
    <div class="topbar-menu">
      <button class="icon-btn" id="topMenuBtn" aria-label="菜单">⋯</button>
      <div class="menu-pop" id="topMenuPop" hidden>
        <a class="menu-item" href="/upload">扫小票</a>
        <a class="menu-item" href="/receipts">小票</a>
        <a class="menu-item" href="/search">搜索</a>
        <a class="menu-item" href="/watchlist">盯价</a>
        <a class="menu-item" href="/alerts">提醒<span class="badge-inline" data-alert-badge hidden></span></a>
        <a class="menu-item" href="/settings">设置</a>
        <button class="menu-item danger" id="logoutBtn">登出</button>
      </div>
    </div>
  </div>
</header>
<main>
  <h1>小票</h1>
  <div class="filters">
    <input type="month" id="fMonth" aria-label="月份">
    <select id="fCategory" aria-label="分类"><option value="">全部分类</option></select>
    <select id="fStore" aria-label="门店"><option value="">全部门店</option></select>
    <button class="mini-btn" id="clearBtn">清除筛选</button>
  </div>
  <div id="list"><p class="muted">加载中…</p></div>
  <div class="pager" id="pager"></div>
  <p class="stats" id="stats"></p>
</main>
<div id="toast"></div>
<script src="/static/app.js"></script>
<script src="/static/receipts.js"></script>
</body>
</html>
